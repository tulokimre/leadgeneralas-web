site:
  name: Leadgenerálás.eu
  site: 'https://leadgeneralas.eu'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Leadgenerálás és automatizált B2B ügyfélszerzés | Tulok Imre
    template: '%s — Leadgenerálás.eu'
  description: 'Kutatásra épülő B2B leadgenerálás, visszautasíthatatlan ajánlatok és automatizált CRM-utánkövetés. Építsünk egy rendszert, ami helyetted is dolgozik.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Leadgenerálás.eu
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: hu
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog fő útvonal (/blog)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'kategoria' # Kategória útvonal (/kategoria/valami)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'cimke' # Címke útvonal (/cimke/valami)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # Ide kerülhet majd a "G-XXXXXXXXXX" kódod

ui:
  theme: 'light' # Érdemes világos ('light') alapértelmezést használni B2B tanácsadói oldalhoz
